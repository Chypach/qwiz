<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />

    <title>Карточка слова</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --cal-level0: #e2e6ee;
            --cal-level1: #c7dcfb;
            --cal-level2: #8fbdf7;
            --cal-level3: #4f97f1;
            --cal-level4: #2f80ed;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;              /* экран не должен прокручиваться на телефоне */
            overscroll-behavior: none;     /* убирает "резиновый" боунс/протяжку окна */
            touch-action: pan-y;           /* разрешаем вертикальную прокрутку (нужна для списка модулей), но запрещаем масштабирование/горизонтальные жесты */
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;            /* учитывает динамическую высоту вьюпорта в мобильных браузерах */
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .app {
            width: 100%;
            max-width: 320px;
            max-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 0;                 /* позволяет дочернему .screen сжиматься и скроллиться, а не выталкивать контент за экран */
        }

        .screen {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .screen.active {
            display: flex;
        }

        #cardScreen.active {
            min-height: calc(100vh - 40px);
            min-height: calc(100dvh - 40px);
            justify-content: center;
            padding-top: 0;
            padding-bottom: 140px;
        }

        /* Список модулей может быть длиннее экрана — даём ему собственную прокрутку */
        #moduleScreen.active {
            max-height: calc(100vh - 40px);
            max-height: calc(100dvh - 40px);
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            overscroll-behavior: contain;
            padding: 4px 4px 24px;         /* небольшой отступ, чтобы контент не прилипал к краям/скроллбару */
        }

        .title {
            font-size: 26px;
            font-weight: bold;
            color: #222222;
            text-align: center;
            margin-bottom: 10px;
        }

        /* Кнопка переключения языка — видна поверх обоих экранов */
        .lang-toggle-btn {
            position: fixed;
            top: calc(14px + env(safe-area-inset-top));
            right: 14px;
            z-index: 30;
            border: none;
            border-radius: 14px;
            padding: 8px 14px;
            background: #ffffff;
            color: #2f80ed;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
        }

        .lang-toggle-btn:active {
            transform: scale(0.94);
        }

        .modules {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .module-item {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .module-btn {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 18px;
            background: #ffffff;
            color: #222222;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.14);
            transition: 0.2s ease;
        }

        .module-btn:active {
            transform: scale(0.96);
        }

        /* Прогресс-бар */
        .progress-bar-outer {
            width: 100%;
            height: 8px;
            background: #e2e6ee;
            border-radius: 8px;
            overflow: hidden;
        }

        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background: #2f80ed;
            border-radius: 8px;
            transition: width 0.3s ease;
        }

        .progress-text {
            font-size: 13px;
            color: #777777;
            text-align: center;
        }

        .card-progress-wrap {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .card-wrapper {
            width: 280px;
            height: 180px;
            perspective: 1000px;
            cursor: pointer;
            position: relative;
            touch-action: none;
            user-select: none;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            /* заставляет браузер отрисовывать элемент на отдельном GPU-слое —
               убирает "фантомные" пиксели/артефакты по краям при перетаскивании */
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            will-change: transform, opacity;
        }

        /* Свечение позади карточки при свайпе */
        .card-glow {
            position: absolute;
            inset: -34px;
            border-radius: 34px;
            filter: blur(38px);
            opacity: 0;
            z-index: 0;
            pointer-events: none;
            background: rgba(47, 128, 237, 0.85);
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            transform-style: preserve-3d;
            transition: transform 0.7s ease;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-side {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 20px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            padding: 20px;
            text-align: center;
        }

        .card-front {
            background: #ffffff;
            color: #222222;
        }

        .card-back {
            background: #2f80ed;
            color: #ffffff;
            transform: rotateY(180deg);
            font-size: 22px;
            line-height: 1.3;
            overflow-y: auto;              /* если текст всё же не влез — можно прокрутить */
            overflow-wrap: break-word;
            word-break: break-word;
            hyphens: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
        }

        .swipe-hint {
            position: absolute;
            top: 14px;
            font-size: 15px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }

        .swipe-hint.know {
            right: 14px;
            background: rgba(39, 174, 96, 0.92);
            color: #ffffff;
        }

        .swipe-hint.dont-know {
            left: 14px;
            background: rgba(217, 48, 37, 0.92);
            color: #ffffff;
        }

        .bottom-controls {
            position: fixed;
            left: 50%;
            bottom: calc(18px + env(safe-area-inset-bottom));
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 320px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 10;
        }

        .back-btn {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 15px;
            background: #ffffff;
            color: #2f80ed;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
        }

        .back-btn:active {
            transform: scale(0.96);
        }

        .reset-btn {
            width: 100%;
            border: none;
            border-radius: 16px;
            padding: 12px;
            background: #ffffff;
            color: #d93025;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
        }

        .reset-btn:active {
            transform: scale(0.96);
        }

        .module-title {
            font-size: 22px;
            font-weight: bold;
            color: #222222;
        }

        .status {
            min-height: 18px;
            font-size: 14px;
            color: #777777;
            text-align: center;
        }

        .status.error {
            color: #d93025;
        }

        button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        /* ============================================================
           СТАТИСТИКА АКТИВНОСТИ
           ============================================================ */

        .stats-toggle-btn {
            position: fixed;
            top: calc(14px + env(safe-area-inset-top));
            left: 14px;
            z-index: 30;
            border: none;
            border-radius: 14px;
            padding: 8px 12px;
            background: #ffffff;
            color: #2f80ed;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.16);
        }

        .stats-toggle-btn:active {
            transform: scale(0.94);
        }

        #statsScreen.active {
            max-height: calc(100vh - 40px);
            max-height: calc(100dvh - 40px);
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-y;
            overscroll-behavior: contain;
            padding: 4px 4px 150px;
        }

        .stats-summary {
            width: 100%;
            display: flex;
            gap: 8px;
        }

        .stat-box {
            flex: 1;
            min-width: 0;
            background: #ffffff;
            border-radius: 16px;
            padding: 14px 6px;
            text-align: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
        }

        .stat-value {
            font-size: 21px;
            font-weight: bold;
            color: #222222;
        }

        .stat-label {
            font-size: 11px;
            color: #777777;
            margin-top: 4px;
            line-height: 1.3;
        }

        .stat-best-streak {
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #555555;
            background: #ffffff;
            border-radius: 14px;
            padding: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            color: #222222;
            text-align: center;
        }

        .chart-section, .calendar-section {
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.1);
        }

        .chart-wrap {
            width: 100%;
            height: 120px;
            display: flex;
            align-items: flex-end;
            gap: 3px;
            padding: 0 2px;
        }

        .chart-bar-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            height: 100%;
            gap: 4px;
            cursor: pointer;
        }

        .chart-bar {
            width: 100%;
            max-width: 22px;
            background: #2f80ed;
            border-radius: 4px 4px 0 0;
            min-height: 3px;
            transition: opacity 0.15s ease;
        }

        .chart-bar.zero {
            background: #e2e6ee;
        }

        .chart-bar-col:active .chart-bar {
            opacity: 0.7;
        }

        .chart-bar-label {
            font-size: 9px;
            color: #999999;
            white-space: nowrap;
        }

        .period-switch {
            display: flex;
            gap: 8px;
        }

        .period-btn {
            border: none;
            border-radius: 12px;
            padding: 8px 16px;
            background: #eef1f6;
            color: #555555;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
        }

        .period-btn.active {
            background: #2f80ed;
            color: #ffffff;
        }

        .calendar-scroll {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            padding-bottom: 4px;
        }

        .calendar-inner {
            display: inline-flex;
            flex-direction: column;
            gap: 4px;
        }

        .calendar-months-row {
            display: flex;
            gap: 2px;
            padding-left: 22px;
        }

        .calendar-month-label {
            width: 12px;
            font-size: 9px;
            color: #999999;
            flex-shrink: 0;
            overflow: visible;
            white-space: nowrap;
        }

        .calendar-body {
            display: flex;
            gap: 4px;
        }

        .calendar-weekday-labels {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 18px;
            flex-shrink: 0;
        }

        .calendar-weekday-label {
            height: 10px;
            font-size: 9px;
            color: #999999;
            line-height: 10px;
        }

        .calendar-weeks {
            display: flex;
            gap: 2px;
        }

        .calendar-week-col {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .cal-cell {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            background: var(--cal-level0);
            cursor: pointer;
        }

        .cal-cell.level1 { background: var(--cal-level1); }
        .cal-cell.level2 { background: var(--cal-level2); }
        .cal-cell.level3 { background: var(--cal-level3); }
        .cal-cell.level4 { background: var(--cal-level4); }

        .cal-cell.future {
            background: transparent;
            cursor: default;
            pointer-events: none;
        }

        .calendar-legend {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 11px;
            color: #999999;
        }

        .legend-cell {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            background: var(--cal-level0);
        }

        .legend-cell.level1 { background: var(--cal-level1); }
        .legend-cell.level2 { background: var(--cal-level2); }
        .legend-cell.level3 { background: var(--cal-level3); }
        .legend-cell.level4 { background: var(--cal-level4); }

        .stat-tooltip {
            position: fixed;
            z-index: 50;
            background: #222222;
            color: #ffffff;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.4;
            pointer-events: none;
            opacity: 0;
            transform: translate(-50%, -100%);
            transition: opacity 0.15s ease;
            max-width: 200px;
            text-align: center;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
        }

        .stat-tooltip.visible {
            opacity: 1;
        }

        .stat-tooltip .tooltip-date {
            font-weight: bold;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="app">

        <button class="lang-toggle-btn" id="langToggleBtn" type="button">EN</button>
        <button class="stats-toggle-btn" id="statsToggleBtn" type="button">📊</button>

        <!-- Стартовый экран выбора модуля -->
        <div class="screen active" id="moduleScreen">
            <div class="title" id="chooseModuleTitle">Выберите модуль</div>

            <!-- Кнопки модулей и прогресс-бары рендерятся динамически в JS -->
            <div class="modules" id="modulesContainer"></div>
        </div>

        <!-- Экран с карточками -->
        <div class="screen" id="cardScreen">
            <div class="module-title" id="moduleTitle">1 module</div>

            <div class="card-progress-wrap">
                <div class="progress-bar-outer">
                    <div class="progress-bar-inner" id="cardProgressBar"></div>
                </div>
                <div class="progress-text" id="cardProgressText">Прогресс: 0%</div>
            </div>

            <div class="status" id="status"></div>

            <div class="card-wrapper" id="cardWrapper">
                <div class="card-glow" id="cardGlow"></div>

                <div class="swipe-hint know" id="swipeRightHint">ЗНАЮ</div>
                <div class="swipe-hint dont-know" id="swipeLeftHint">НЕ ЗНАЮ</div>

                <div class="card" id="card">
                    <div class="card-side card-front" id="cardFront">
                        слово
                    </div>

                    <div class="card-side card-back" id="cardBack">
                        определение
                    </div>
                </div>
            </div>

            <!-- Нижнее управление: навигация теперь только свайпами -->
            <div class="bottom-controls">
                <button class="back-btn" id="backBtn">Назад к модулям</button>
                <button class="reset-btn" id="resetBtn">Сбросить прогресс модуля</button>
            </div>
        </div>

        <!-- Экран статистики активности -->
        <div class="screen" id="statsScreen">
            <div class="title" id="statsTitle">Statistics</div>

            <div class="stats-summary">
                <div class="stat-box">
                    <div class="stat-value" id="statTotalWords">0</div>
                    <div class="stat-label">📚 <span id="statTotalLabel">Words studied</span></div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statWeekWords">0</div>
                    <div class="stat-label">📅 <span id="statWeekLabel">This week</span></div>
                </div>
                <div class="stat-box">
                    <div class="stat-value" id="statStreak">0</div>
                    <div class="stat-label">🔥 <span id="statStreakLabel">Current streak</span></div>
                </div>
            </div>

            <div class="stat-best-streak">🏆 <span id="statBestStreakLabel">Best streak</span>: <span id="statBestStreak">0</span></div>

            <div class="chart-section">
                <div class="section-title" id="chartTitle">Words studied per day</div>
                <div class="chart-wrap" id="dailyChart"></div>
                <div class="period-switch">
                    <button class="period-btn active" id="period7Btn" type="button">7 days</button>
                    <button class="period-btn" id="period30Btn" type="button">30 days</button>
                </div>
            </div>

            <div class="calendar-section">
                <div class="section-title" id="calendarTitle">English Activity</div>
                <div class="calendar-scroll" id="calendarScroll"></div>
                <div class="calendar-legend">
                    <span id="legendLess">Less</span>
                    <span class="legend-cell"></span>
                    <span class="legend-cell level1"></span>
                    <span class="legend-cell level2"></span>
                    <span class="legend-cell level3"></span>
                    <span class="legend-cell level4"></span>
                    <span id="legendMore">More</span>
                </div>
            </div>

            <div class="bottom-controls">
                <button class="back-btn" id="statsBackBtn" type="button">Back to modules</button>
            </div>
        </div>

    </div>

    <div class="stat-tooltip" id="statTooltip"></div>

    <script>
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }


        //?module=module1

        const moduleTitle = document.getElementById("moduleTitle");
        const status = document.getElementById("status");

        const cardProgressBar = document.getElementById("cardProgressBar");
        const cardProgressText = document.getElementById("cardProgressText");

        // ============================================================
        // ЯЗЫК ИНТЕРФЕЙСА (RU / EN)
        // ============================================================

        const LANG_STORAGE_KEY = "flashcards_lang";

        const translations = {

                monthsFull: ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"]
            },
            en: {
                chooseModule: "Choose a module",

                resetProgress: "Reset module progress",
                loadingCards: "Loading cards...",

                loadError: "Loading error",

                monthsFull: ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"]
            }
        };

        let currentLang = localStorage.getItem(LANG_STORAGE_KEY) || "ru";
        if (!translations[currentLang]) {
            currentLang = "ru";

            legendMoreEl.textContent = t("legendMore");

                renderAllStats();

        }

        langToggleBtn.addEventListener("click", () => {
            currentLang = currentLang === "ru" ? "en" : "ru";
            localStorage.setItem(LANG_STORAGE_KEY, currentLang);
            applyLanguage();
        });

        // ============================================================
        // ХРАНЕНИЕ ПРОГРЕССА В localStorage
        // ============================================================
        //
        // Структура:
        // {
        //   "<moduleKey>": {
        //     "cards": {
        //       "<слово>": { "weight": number, "known": true | false | null }
        //     }
        //   }
        // }
        //
        // weight — используется для взвешенного случайного выбора карточки:
        //   чем меньше weight, тем реже карточка попадается (пользователь её знает),
        //   чем больше weight, тем чаще она попадается (пользователь её не знает).
        // known  — null, пока пользователь ни разу не свайпнул карточку.
        //          true/false — после свайпа вправо/влево соответственно.

        const STORAGE_KEY = "flashcards_progress_v1";

        const DEFAULT_WEIGHT = 1;
        const MIN_WEIGHT = 0.15;
        const MAX_WEIGHT = 8;
        const KNOWN_FACTOR = 0.4;   // во сколько раз уменьшаем вес при "знаю"
        const UNKNOWN_FACTOR = 1.8; // во сколько раз увеличиваем вес при "не знаю"

        function loadProgressState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                return raw ? JSON.parse(raw) : {};
            } catch (e) {
                console.warn("Не удалось прочитать прогресс из localStorage", e);
                return {};
            }
        }

        function saveProgressState(state) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.warn("Не удалось сохранить прогресс в localStorage", e);
            }
        }

        function ensureModuleStateInPlace(state, moduleName) {
            if (!state[moduleName]) {
                state[moduleName] = { cards: {} };
            }
            if (!state[moduleName].cards) {
                state[moduleName].cards = {};
            }
            return state[moduleName];
        }

        function getModuleState(moduleName) {
            const state = loadProgressState();
            return ensureModuleStateInPlace(state, moduleName);
        }

        // Синхронизирует список карточек модуля (пришедший из API) с тем,
        // что уже сохранено в localStorage. Это нужно, чтобы:
        //  - новые слова, добавленные в лист Google Таблицы, появлялись
        //    в прогрессе с базовым весом и статусом "не пройдено" —
        //    как будто они были всегда, просто пользователь их ещё не смахивал;
        //  - существующий прогресс по уже известным словам НЕ сбрасывался
        //    (никакой конфронтации/перезаписи при добавлении новых слов);
        //  - слова, которые удалили из листа, не портили расчёт процента прогресса.
        function syncCardsWithProgress(moduleName, cards) {
            const state = loadProgressState();
            const moduleState = ensureModuleStateInPlace(state, moduleName);

            const currentWords = new Set(cards.map(c => c.word));

            cards.forEach(c => {
                if (!moduleState.cards[c.word]) {
                    moduleState.cards[c.word] = { weight: DEFAULT_WEIGHT, known: null };
                }
            });

            Object.keys(moduleState.cards).forEach(word => {
                if (!currentWords.has(word)) {
                    delete moduleState.cards[word];
                }
            });

            saveProgressState(state);
            return moduleState;
        }

        function markCardResult(moduleName, word, isKnown) {
            const state = loadProgressState();
            const moduleState = ensureModuleStateInPlace(state, moduleName);
            const entry = moduleState.cards[word] || { weight: DEFAULT_WEIGHT, known: null };

            if (isKnown) {
                entry.known = true;
                entry.weight = Math.max(MIN_WEIGHT, entry.weight * KNOWN_FACTOR);
            } else {
                entry.known = false;
                entry.weight = Math.min(MAX_WEIGHT, entry.weight * UNKNOWN_FACTOR);
            }

            moduleState.cards[word] = entry;
            saveProgressState(state);
        }

        function resetModuleProgress(moduleName) {
            const state = loadProgressState();
            const cards = modules[moduleName]?.cards || [];

            const freshCards = {};
            cards.forEach(c => {
                freshCards[c.word] = { weight: DEFAULT_WEIGHT, known: null };
            });

            state[moduleName] = { cards: freshCards };
            saveProgressState(state);
        }

        // Процент прогресса = доля карточек, помеченных как "знаю" (known === true),
        // от общего количества карточек в модуле.
        function computeModuleProgress(moduleName, cards) {
            if (!cards || cards.length === 0) {
                return { percent: 0, known: 0, total: 0 };
            }

            const moduleState = getModuleState(moduleName);
            let known = 0;

            cards.forEach(c => {
                const entry = moduleState.cards[c.word];
                if (entry && entry.known === true) {
                    known++;
                }
            });

            const percent = Math.round((known / cards.length) * 100);
            return { percent, known, total: cards.length };
        }

        // Взвешенный случайный выбор следующей карточки.
        // Карточки с бОльшим весом (незнакомые) попадаются чаще,
        // карточки с меньшим весом (знакомые) — реже.
        function pickNextIndex(cards, moduleState, excludeIndex) {
            const weights = cards.map(c => {
                const entry = moduleState.cards[c.word];
                return entry ? entry.weight : DEFAULT_WEIGHT;
            });

            let total = weights.reduce((a, b) => a + b, 0);
            if (total <= 0) {
                weights.fill(1);
                total = weights.length;
            }

            for (let attempt = 0; attempt < 8; attempt++) {
                let r = Math.random() * total;
                let idx = 0;
                for (; idx < weights.length; idx++) {
                    r -= weights[idx];
                    if (r <= 0) break;
                }
                idx = Math.min(idx, weights.length - 1);

                if (cards.length === 1 || idx !== excludeIndex) {
                    return idx;
                }
            }

            return excludeIndex >= 0 ? excludeIndex : 0;
        }

        // ============================================================
        // СПИСОК МОДУЛЕЙ (ЛИСТОВ ТАБЛИЦЫ)
        // ============================================================
        //
        // Чтобы новые листы Google Таблицы автоматически становились новыми
        // модулями, бэкенд должен отдавать список листов отдельным эндпоинтом.
        // Ожидаемый формат ответа GET {origin}/api/modules:
        //   ["Module1", "Module2", ...]
        //   либо [{ "key": "module1", "title": "1 module" }, ...]
        //   либо { "modules": [...] } / { "data": [...] }
        //
        // Если такого эндпоинта пока нет или запрос не удался — используется
        // жёстко заданный список модулей выше (модули по умолчанию), чтобы
        // приложение продолжало работать без изменений на бэкенде.
        async function fetchModulesList() {
            try {
                const base = new URL(API_BASE_URL);
                const listUrl = `${base.origin}/api/modules`;

                const response = await fetch(listUrl, {
                    method: "GET",
                    headers: { "Accept": "application/json" }
                });

                if (!response.ok) {
                    throw new Error(`Список модулей: ошибка ${response.status}`);
                }

                const data = await response.json();
                const rawList = Array.isArray(data) ? data : (data.modules || data.data || []);

                const list = rawList
                    .map(item => {
                        if (typeof item === "string") {
                            return { key: item, title: item };
                        }
                        return {
                            key: item.key || item.id || item.name || "",
                            title: item.title || item.name || item.key || ""
                        };
                    })
                    .filter(m => m.key);

                if (list.length === 0) {
                    throw new Error("Пустой список модулей");
                }

                return list;
            } catch (e) {
                console.warn("Не удалось получить список модулей с сервера, использую значения по умолчанию", e);
                return Object.keys(modules).map(key => ({ key, title: modules[key].title }));
            }
        }

        function renderModuleButtons(moduleList) {
            modulesContainer.innerHTML = "";

            moduleList.forEach(mod => {
                if (!modules[mod.key]) {
                    modules[mod.key] = { title: mod.title, cards: null };
                } else {
                    modules[mod.key].title = mod.title;
                }

                const item = document.createElement("div");
                item.className = "module-item";

                const btn = document.createElement("button");
                btn.className = "module-btn";
                btn.dataset.module = mod.key;
                btn.textContent = mod.title;
                btn.addEventListener("click", () => showCardScreen(mod.key));

                const barOuter = document.createElement("div");
                barOuter.className = "progress-bar-outer";

                const barInner = document.createElement("div");
                barInner.className = "progress-bar-inner";
                barInner.id = `progress-bar-${mod.key}`;

                barOuter.appendChild(barInner);

                const text = document.createElement("div");
                text.className = "progress-text";
                text.id = `progress-text-${mod.key}`;
                text.textContent = "0%";

                item.appendChild(btn);
                item.appendChild(barOuter);
                item.appendChild(text);

                modulesContainer.appendChild(item);
            });
        }

        function updateModuleListProgressUI(moduleName, cards) {
            const { percent } = computeModuleProgress(moduleName, cards);
            const bar = document.getElementById(`progress-bar-${moduleName}`);
            const text = document.getElementById(`progress-text-${moduleName}`);
            if (bar) bar.style.width = `${percent}%`;
            if (text) text.textContent = `${percent}%`;
        }

        // Заранее подгружает карточки всех модулей, чтобы на экране выбора
        // модуля сразу были видны актуальные проценты прогресса.
        // Если какой-то модуль не грузится — просто оставляем для него 0%,
        // это не мешает работе остальных модулей.
        async function prefetchAllModulesProgress(moduleList) {
            for (const mod of moduleList) {
                try {
                    const cards = await loadCardsForModule(mod.key);
                    syncCardsWithProgress(mod.key, cards);
                    updateModuleListProgressUI(mod.key, cards);
                } catch (e) {
                    console.warn(`Не удалось предзагрузить карточки модуля ${mod.key}`, e);
                }
            }
        }

        // ============================================================
        // ЗАГРУЗКА КАРТОЧЕК
        // ============================================================

        function setStatus(message = "", isError = false) {
            status.textContent = message;
            status.classList.toggle("error", isError);
        }

        function buildCardsUrl(moduleName) {
            const url = new URL(API_BASE_URL);
            url.searchParams.set("module", moduleName);
            return url.toString();
        }

        function normalizeCards(apiResponse) {
            let rawCards = Array.isArray(apiResponse)
                ? apiResponse
                : apiResponse.cards || apiResponse.data || [];

            if (typeof rawCards === "string") {
                rawCards = JSON.parse(rawCards);
            }

            if (!Array.isArray(rawCards) && rawCards && typeof rawCards === "object") {
                rawCards = rawCards.cards || rawCards.data || [];
            }

            if (!Array.isArray(rawCards)) {
                throw new Error("cards должен быть массивом, но пришло: " + typeof rawCards);
            }

            const normalizedCards = [];

            for (const item of rawCards) {
                const word = String(item.word || item.term || item.title || "").trim();
                const definition = String(item.definition || item.meaning || item.description || "").trim();

                if (word && definition) {
                    normalizedCards.push({ word, definition });
                }
            }

            return normalizedCards;
        }

        async function loadCardsForModule(moduleName) {
            if (cardsCache[moduleName]) {
                return cardsCache[moduleName];
            }

            const response = await fetch(buildCardsUrl(moduleName), {
                method: "GET",
                headers: { "Accept": "application/json" }
            });

            if (!response.ok) {
                throw new Error(`API вернул ошибку ${response.status}`);
            }

            const data = await response.json();
            const cards = normalizeCards(data);

            if (cards.length === 0) {
                throw new Error("API не вернул карточки в нужном формате");
            }

            cardsCache[moduleName] = cards;
            if (!modules[moduleName]) {
                modules[moduleName] = { title: moduleName, cards: null };
            }
            modules[moduleName].cards = cards;

            return cards;
        }

        function showModuleScreen() {
            cardScreen.classList.remove("active");
            moduleScreen.classList.add("active");
            resetCardFaceInstant();
            setStatus("");

            // обновляем прогресс на карточках модулей на случай,
            // если пользователь только что что-то прошёл
            if (currentModule) {
                updateModuleListProgressUI(currentModule, getCurrentCards());
            }
        }

        async function showCardScreen(moduleName) {
            currentModule = moduleName;
            currentIndex = 0;

            moduleScreen.classList.remove("active");
            cardScreen.classList.add("active");

            moduleTitle.textContent = modules[currentModule]?.title || moduleName;
            cardFront.textContent = t("loadingCard");
            cardBack.textContent = "";
            resetCardFaceInstant();
            setStatus(t("loadingCards"));

            try {
                const cards = await loadCardsForModule(moduleName);
                syncCardsWithProgress(moduleName, cards);

                const moduleState = getModuleState(moduleName);
                currentIndex = pickNextIndex(cards, moduleState, -1);

                setStatus("");
                updateCard();
            } catch (error) {
                showLoadError(error.message);
            }
        }

        function showLoadError(message) {
            resetCardFaceInstant();
            cardFront.textContent = t("loadError");
            cardBack.textContent = message;
            setCardBackFontSize(message);
            setStatus(message, true);
        }

        function getCurrentCards() {
            return modules[currentModule]?.cards || [];
        }

        function updateProgressUI() {
            if (!currentModule) return;
            const cards = getCurrentCards();
            const { percent } = computeModuleProgress(currentModule, cards);

            cardProgressBar.style.width = `${percent}%`;
            cardProgressText.textContent = `${t("progress")}: ${percent}%`;

            updateModuleListProgressUI(currentModule, cards);
        }

        // Мгновенно (без анимации переворота) возвращает карточку лицевой стороной.
        // Нужно, чтобы при переходе к следующей карточке не было "домаргивания"
        // переворотом от предыдущей (если она была перевёрнута).
        function resetCardFaceInstant() {
            card.style.transition = "none";
            card.classList.remove("flipped");
            void card.offsetWidth; // форсируем reflow, чтобы transition:none применился до следующего изменения
            card.style.transition = "";
        }

        // Слово на лицевой стороне всегда одного размера (стиль не меняем).
        // Текст описания на обратной стороне — динамический: чем длиннее текст,
        // тем меньше шрифт, чтобы он не вылезал за пределы карточки.
        function setCardBackFontSize(text) {
            const length = (text || "").length;
            let fontSize;

            if (length <= 40) {
                fontSize = 22;
            } else if (length <= 80) {
                fontSize = 19;
            } else if (length <= 140) {
                fontSize = 16;
            } else if (length <= 220) {
                fontSize = 14;
            } else {
                fontSize = 12;
            }

            cardBack.style.fontSize = `${fontSize}px`;
        }

        function updateCard() {
            const cards = getCurrentCards();

            if (cards.length === 0) {
                showLoadError(t("noCards"));
                return;
            }

            resetCardFaceInstant();

            moduleTitle.textContent = modules[currentModule]?.title || currentModule;
            cardFront.textContent = cards[currentIndex].word;
            cardBack.textContent = cards[currentIndex].definition;
            setCardBackFontSize(cards[currentIndex].definition);

            updateProgressUI();
        }

        // ============================================================
        // СВАЙПЫ: вправо = "знаю", влево = "не знаю"
        // Навигация по карточкам теперь только свайпами (кнопки убраны).
        // ============================================================

        let dragState = null;
        const SWIPE_THRESHOLD = 90;
        const MOVE_THRESHOLD = 8;
        const GLOW_MAX_DISTANCE = 140;

        const KNOW_GLOW_COLOR = "rgba(39, 174, 96, 0.85)";
        const DONT_KNOW_GLOW_COLOR = "rgba(217, 48, 37, 0.85)";

        function updateGlow(dx) {
            if (dx === 0) {
                cardGlow.style.opacity = 0;
                return;
            }

            cardGlow.style.background = dx > 0 ? KNOW_GLOW_COLOR : DONT_KNOW_GLOW_COLOR;
            const intensity = Math.min(Math.abs(dx) / GLOW_MAX_DISTANCE, 1);
            cardGlow.style.opacity = intensity;
        }

        function resetCardWrapperPosition(withTransition) {
            cardWrapper.style.transition = withTransition
                ? "transform 0.3s ease"
                : "none";
            cardWrapper.style.transform = "translateZ(0) translateX(0) rotate(0)";

            cardGlow.style.transition = withTransition ? "opacity 0.25s ease" : "none";
            cardGlow.style.opacity = 0;

            swipeRightHint.style.opacity = 0;
            swipeLeftHint.style.opacity = 0;
        }

        function swipeAction(direction) {
            const cards = getCurrentCards();
            if (cards.length === 0) return;

            const word = cards[currentIndex].word;
            markCardResult(currentModule, word, direction === "right");

            // В статистику "изучено слов" попадают только карточки,
            // помеченные как "ЗНАЮ" — свайп влево ("НЕ ЗНАЮ") не считается.
            if (direction === "right") {
                recordWordStudy();
            }

            const flyDistance = window.innerWidth;
            const flyX = direction === "right" ? flyDistance : -flyDistance;
            const flyRotate = direction === "right" ? 25 : -25;

            cardWrapper.style.transition = "transform 0.35s ease, opacity 0.35s ease";
            cardWrapper.style.transform = `translateZ(0) translateX(${flyX}px) rotate(${flyRotate}deg)`;
            cardWrapper.style.opacity = "0";

            cardGlow.style.background = direction === "right" ? KNOW_GLOW_COLOR : DONT_KNOW_GLOW_COLOR;
            cardGlow.style.transition = "opacity 0.35s ease";
            cardGlow.style.opacity = 1;

            swipeRightHint.style.opacity = 0;
            swipeLeftHint.style.opacity = 0;

            setTimeout(() => {
                cardWrapper.style.transition = "none";
                cardWrapper.style.transform = "translateZ(0) translateX(0) rotate(0)";
                cardWrapper.style.opacity = "1";

                cardGlow.style.transition = "none";
                cardGlow.style.opacity = 0;

                const moduleState = getModuleState(currentModule);
                currentIndex = pickNextIndex(cards, moduleState, currentIndex);
                updateCard();
            }, 320);
        }

        cardWrapper.addEventListener("pointerdown", (e) => {
            if (getCurrentCards().length === 0) return;

            dragState = { startX: e.clientX, startY: e.clientY, dx: 0, moved: false };
            cardWrapper.setPointerCapture(e.pointerId);
            cardWrapper.style.transition = "none";
            cardGlow.style.transition = "none";
        });

        cardWrapper.addEventListener("pointermove", (e) => {
            if (!dragState) return;

            const dx = e.clientX - dragState.startX;
            const dy = e.clientY - dragState.startY;

            if (Math.abs(dx) > MOVE_THRESHOLD || Math.abs(dy) > MOVE_THRESHOLD) {
                dragState.moved = true;
            }

            if (dragState.moved) {
                // ограничиваем максимальный сдвиг, чтобы карточку нельзя было
                // утащить за пределы экрана и "сдвинуть" тем самым окно
                const clampedDx = Math.max(Math.min(dx, window.innerWidth), -window.innerWidth);

                cardWrapper.style.transform = `translateZ(0) translateX(${clampedDx}px) rotate(${clampedDx / 18}deg)`;

                const rightOpacity = Math.min(Math.max(clampedDx / 100, 0), 1);
                const leftOpacity = Math.min(Math.max(-clampedDx / 100, 0), 1);
                swipeRightHint.style.opacity = rightOpacity;
                swipeLeftHint.style.opacity = leftOpacity;

                updateGlow(clampedDx);
            }

            dragState.dx = dx;
        });

        function finishDrag() {
            if (!dragState) return;

            const dx = dragState.dx || 0;
            const wasMoved = dragState.moved;
            dragState = null;

            if (!wasMoved) {
                // это был тап, а не свайп — переворачиваем карточку
                resetCardWrapperPosition(true);
                card.classList.toggle("flipped");
                return;
            }

            if (dx > SWIPE_THRESHOLD) {
                swipeAction("right");
            } else if (dx < -SWIPE_THRESHOLD) {
                swipeAction("left");
            } else {
                resetCardWrapperPosition(true);
            }
        }

        cardWrapper.addEventListener("pointerup", finishDrag);
        cardWrapper.addEventListener("pointercancel", () => {
            dragState = null;
            resetCardWrapperPosition(true);
        });

        // ============================================================
        // ОСТАЛЬНЫЕ КНОПКИ
        // ============================================================

        backBtn.addEventListener("click", () => {
            showModuleScreen();
        });

        resetBtn.addEventListener("click", () => {
            if (!currentModule) return;

            const confirmed = window.confirm(t("resetConfirm"));
            if (!confirmed) return;

            resetModuleProgress(currentModule);

            const cards = getCurrentCards();
            const moduleState = getModuleState(currentModule);
            currentIndex = pickNextIndex(cards, moduleState, -1);

            updateCard();
        });

        // ============================================================
        // СТАТИСТИКА АКТИВНОСТИ (Words studied / English Activity)
        // ============================================================
        //
        // Хранится отдельно от прогресса карточек, в собственном ключе
        // localStorage. Хранятся только дни с активностью (count > 0),
        // отсутствующие даты при построении графика/календаря считаются 0.

        const ACTIVITY_STORAGE_KEY = "english_activity";

        // Пороги уровней интенсивности календаря вынесены в конфигурацию,
        // чтобы их можно было легко поменять в одном месте.
        const ACTIVITY_LEVELS = {
            level1: 5,
            level2: 10,
            level3: 20
        };

        const CALENDAR_WEEKS_BACK = 53; // с запасом покрывает последние 12 месяцев

        function getActivityData() {
            try {
                const raw = localStorage.getItem(ACTIVITY_STORAGE_KEY);
                if (!raw) return {};
                const parsed = JSON.parse(raw);
                return (parsed && typeof parsed === "object" && !Array.isArray(parsed)) ? parsed : {};
            } catch (e) {
                console.warn("Не удалось прочитать статистику активности из localStorage", e);
                return {};
            }
        }

        function saveActivityData(data) {
            try {
                localStorage.setItem(ACTIVITY_STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.warn("Не удалось сохранить статистику активности в localStorage", e);
            }
        }

        // Локальная (не UTC) дата пользователя в формате YYYY-MM-DD.
        function getLocalDateKey(date) {
            const d = date || new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, "0");
            const day = String(d.getDate()).padStart(2, "0");
            return `${y}-${m}-${day}`;
        }

        // Единая точка учёта: одно завершённое прохождение карточки =
        // одно увеличение статистики за сегодня. Вызывается ровно один
        // раз за один свайп (см. swipeAction) — это и есть защита от
        // двойного подсчёта, т.к. переворот карточки (тап) эту функцию
        // не вызывает.
        function recordWordStudy() {
            const data = getActivityData();
            const key = getLocalDateKey();
            data[key] = (data[key] || 0) + 1;
            saveActivityData(data);
            refreshStatsUI();
        }

        function getWordsForDate(date) {
            const data = getActivityData();
            const key = typeof date === "string" ? date : getLocalDateKey(date);
            return data[key] || 0;
        }

        function getWordsForLastDays(days) {
            const data = getActivityData();
            const today = new Date();
            const result = [];

            for (let i = days - 1; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                const key = getLocalDateKey(d);
                result.push({ dateKey: key, date: d, count: data[key] || 0 });
            }

            return result;
        }

        function getWeekStart(date) {
            const d = new Date(date);
            d.setHours(0, 0, 0, 0);
            const day = d.getDay(); // 0 = Вс..6 = Сб
            const diff = day === 0 ? -6 : 1 - day; // сдвиг до понедельника
            d.setDate(d.getDate() + diff);
            return d;
        }

        function getWordsThisWeek() {
            const data = getActivityData();
            const monday = getWeekStart(new Date());
            let total = 0;

            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(d.getDate() + i);
                total += data[getLocalDateKey(d)] || 0;
            }

            return total;
        }

        function getTotalWordsStudied() {
            const data = getActivityData();
            return Object.values(data).reduce((sum, v) => sum + (Number(v) || 0), 0);
        }

        function calculateCurrentStreak() {
            const data = getActivityData();
            const today = new Date();
            const todayKey = getLocalDateKey(today);
            const hasToday = (data[todayKey] || 0) > 0;

            const cursor = new Date(today);

            if (!hasToday) {
                // сегодня ещё ничего не изучено — серия продолжается,
                // только если вчера была активность, иначе она равна 0
                cursor.setDate(cursor.getDate() - 1);
                const yesterdayKey = getLocalDateKey(cursor);
                if (!((data[yesterdayKey] || 0) > 0)) {
                    return 0;
                }
            }

            let streak = 0;
            while (true) {
                const key = getLocalDateKey(cursor);
                if ((data[key] || 0) > 0) {
                    streak++;
                    cursor.setDate(cursor.getDate() - 1);
                } else {
                    break;
                }
            }

            return streak;
        }

        // Best streak считается заново из полной истории, поэтому он
        // никогда не уменьшается сам по себе — только растёт вместе с данными.
        function calculateBestStreak() {
            const data = getActivityData();
            const activeDates = Object.keys(data)
                .filter(k => (data[k] || 0) > 0)
                .sort();

            if (activeDates.length === 0) return 0;

            let best = 1;
            let current = 1;

            for (let i = 1; i < activeDates.length; i++) {
                const prev = new Date(activeDates[i - 1] + "T00:00:00");
                const curr = new Date(activeDates[i] + "T00:00:00");
                const diffDays = Math.round((curr - prev) / 86400000);

                current = diffDays === 1 ? current + 1 : 1;
                if (current > best) best = current;
            }

            return best;
        }

        function computeActivityLevel(count) {
            if (!count || count <= 0) return 0;
            if (count <= ACTIVITY_LEVELS.level1) return 1;
            if (count <= ACTIVITY_LEVELS.level2) return 2;
            if (count <= ACTIVITY_LEVELS.level3) return 3;
            return 4;
        }

        function formatFullDate(date) {
            const day = date.getDate();
            const year = date.getFullYear();
            const months = translations[currentLang].monthsFull;

            return currentLang === "ru"
                ? `${day} ${months[date.getMonth()]} ${year}`
                : `${months[date.getMonth()]} ${day}, ${year}`;
        }

        // ------------------------------------------------------------
        // UI: элементы
        // ------------------------------------------------------------

        const statsScreen = document.getElementById("statsScreen");
        const statsToggleBtn = document.getElementById("statsToggleBtn");
        const statsBackBtn = document.getElementById("statsBackBtn");

        const statsTitleEl = document.getElementById("statsTitle");
        const statTotalWordsEl = document.getElementById("statTotalWords");
        const statTotalLabelEl = document.getElementById("statTotalLabel");
        const statWeekWordsEl = document.getElementById("statWeekWords");
        const statWeekLabelEl = document.getElementById("statWeekLabel");
        const statStreakEl = document.getElementById("statStreak");
        const statStreakLabelEl = document.getElementById("statStreakLabel");
        const statBestStreakEl = document.getElementById("statBestStreak");
        const statBestStreakLabelEl = document.getElementById("statBestStreakLabel");

        const chartTitleEl = document.getElementById("chartTitle");
        const dailyChartEl = document.getElementById("dailyChart");
        const period7Btn = document.getElementById("period7Btn");
        const period30Btn = document.getElementById("period30Btn");

        const calendarTitleEl = document.getElementById("calendarTitle");
        const calendarScrollEl = document.getElementById("calendarScroll");
        const legendLessEl = document.getElementById("legendLess");
        const legendMoreEl = document.getElementById("legendMore");

        const statTooltipEl = document.getElementById("statTooltip");

        let currentChartPeriod = 7;
        let statsScreenOpened = false;

        function showStatsScreen() {
            moduleScreen.classList.remove("active");
            cardScreen.classList.remove("active");
            statsScreen.classList.add("active");
            statsScreenOpened = true;
            hideStatTooltip();
            renderAllStats();
        }

        function hideStatsScreen() {
            statsScreen.classList.remove("active");
            statsScreenOpened = false;
            hideStatTooltip();
            moduleScreen.classList.add("active");
        }

        function showStatTooltip(anchorEl, lines) {
            const rect = anchorEl.getBoundingClientRect();
            statTooltipEl.innerHTML = lines
                .map((line, i) => `<div${i === 0 ? ' class="tooltip-date"' : ""}>${line}</div>`)
                .join("");
            statTooltipEl.style.left = `${rect.left + rect.width / 2}px`;
            statTooltipEl.style.top = `${rect.top - 8}px`;
            statTooltipEl.classList.add("visible");
        }

        function hideStatTooltip() {
            statTooltipEl.classList.remove("visible");
        }

        document.addEventListener("click", (e) => {
            if (!statTooltipEl.classList.contains("visible")) return;
            if (e.target.closest(".chart-bar-col") || e.target.closest(".cal-cell")) return;
            hideStatTooltip();
        });

        function renderSummary() {
            statTotalWordsEl.textContent = getTotalWordsStudied();
            statWeekWordsEl.textContent = getWordsThisWeek();
            statStreakEl.textContent = calculateCurrentStreak();
            statBestStreakEl.textContent = calculateBestStreak();
        }

        function renderDailyChart(days) {
            currentChartPeriod = days;
            period7Btn.classList.toggle("active", days === 7);
            period30Btn.classList.toggle("active", days === 30);

            const items = getWordsForLastDays(days);
            const max = Math.max(1, ...items.map(i => i.count));

            dailyChartEl.innerHTML = "";

            items.forEach(item => {
                const col = document.createElement("div");
                col.className = "chart-bar-col";

                const bar = document.createElement("div");
                bar.className = "chart-bar" + (item.count === 0 ? " zero" : "");
                const heightPercent = item.count === 0 ? 3 : Math.max(6, Math.round((item.count / max) * 100));
                bar.style.height = `${heightPercent}%`;
                col.appendChild(bar);

                if (days === 7) {
                    const label = document.createElement("div");
                    label.className = "chart-bar-label";
                    label.textContent = t("weekdaysShort")[(item.date.getDay() + 6) % 7];
                    col.appendChild(label);
                }

                const tooltipLines = [
                    formatFullDate(item.date),
                    item.count > 0 ? `${item.count} ${t("wordsStudiedSuffix")}` : t("noWordsStudied")
                ];

                col.addEventListener("click", () => showStatTooltip(bar, tooltipLines));

                dailyChartEl.appendChild(col);
            });
        }

        function buildCalendarWeeks() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const start = new Date(today);
            start.setDate(start.getDate() - CALENDAR_WEEKS_BACK * 7);
            const startDay = start.getDay();
            start.setDate(start.getDate() + (startDay === 0 ? -6 : 1 - startDay)); // выравниваем на понедельник

            const weeks = [];
            const cursor = new Date(start);

            while (cursor <= today) {
                const week = [];
                for (let i = 0; i < 7; i++) {
                    week.push(new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate() + i));
                }
                weeks.push(week);
                cursor.setDate(cursor.getDate() + 7);
            }

            return { weeks, today };
        }

        function renderActivityCalendar() {
            const data = getActivityData();
            const { weeks, today } = buildCalendarWeeks();

            calendarScrollEl.innerHTML = "";

            const inner = document.createElement("div");
            inner.className = "calendar-inner";

            // Строка с подписями месяцев — столбцы совпадают со столбцами недель ниже
            const monthsRow = document.createElement("div");
            monthsRow.className = "calendar-months-row";

            let lastLabeledMonth = -1;
            weeks.forEach(week => {
                const label = document.createElement("div");
                label.className = "calendar-month-label";

                const firstOfMonthDay = week.find(d => d.getDate() === 1);
                if (firstOfMonthDay && firstOfMonthDay.getMonth() !== lastLabeledMonth) {
                    label.textContent = t("monthsShort")[firstOfMonthDay.getMonth()];
                    lastLabeledMonth = firstOfMonthDay.getMonth();
                }

                monthsRow.appendChild(label);
            });

            // Подписи дней недели (Пн/Вт/.../Вс) + сама сетка
            const body = document.createElement("div");
            body.className = "calendar-body";

            const weekdayLabels = document.createElement("div");
            weekdayLabels.className = "calendar-weekday-labels";
            const shortNames = t("weekdaysShort");
            shortNames.forEach((name, idx) => {
                const el = document.createElement("div");
                el.className = "calendar-weekday-label";
                // показываем не все подписи, чтобы не загромождать узкую колонку
                el.textContent = (idx === 0 || idx === 2 || idx === 4) ? name : "";
                weekdayLabels.appendChild(el);
            });

            const weeksWrap = document.createElement("div");
            weeksWrap.className = "calendar-weeks";

            weeks.forEach(week => {
                const col = document.createElement("div");
                col.className = "calendar-week-col";

                week.forEach(date => {
                    const cell = document.createElement("div");
                    const isFuture = date > today;
                    const key = getLocalDateKey(date);
                    const count = data[key] || 0;

                    cell.className = "cal-cell" + (isFuture ? " future" : ` level${computeActivityLevel(count)}`);

                    if (!isFuture) {
                        const tooltipLines = [
                            formatFullDate(date),
                            count > 0 ? `${count} ${t("wordsStudiedSuffix")}` : t("noActivity")
                        ];
                        cell.addEventListener("click", () => showStatTooltip(cell, tooltipLines));
                    }

                    col.appendChild(cell);
                });

                weeksWrap.appendChild(col);
            });

            body.appendChild(weekdayLabels);
            body.appendChild(weeksWrap);

            inner.appendChild(monthsRow);
            inner.appendChild(body);
            calendarScrollEl.appendChild(inner);

            // сразу прокручиваем к текущему дню (самая правая часть календаря)
            calendarScrollEl.scrollLeft = calendarScrollEl.scrollWidth;
        }

        function renderAllStats() {
            renderSummary();
            renderDailyChart(currentChartPeriod);
            renderActivityCalendar();
        }

        // Вызывается после recordWordStudy(): обновляет UI мгновенно,
        // если пользователь сейчас находится на экране статистики.
        function refreshStatsUI() {
            if (statsScreenOpened) {
                renderAllStats();
            }
        }

        statsToggleBtn.addEventListener("click", showStatsScreen);
        statsBackBtn.addEventListener("click", hideStatsScreen);
        period7Btn.addEventListener("click", () => renderDailyChart(7));
        period30Btn.addEventListener("click", () => renderDailyChart(30));

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================

        async function init() {
            applyLanguage();

            const moduleList = await fetchModulesList();
            renderModuleButtons(moduleList);
            prefetchAllModulesProgress(moduleList);
        }

        init();
    </script>

</body>
